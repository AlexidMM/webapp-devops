<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp DevOps - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- MÓDULO DE LOGIN -->
  <div id="login-screen" class="flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
      <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Inicio de Sesión</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Usuario</label>
          <input type="text" id="login-username" class="w-full mt-1 p-2 border rounded-md" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="login-password" class="w-full mt-1 p-2 border rounded-md" required>
        </div>
        <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">Ingresar</button>
      </form>
      <p id="login-error" class="text-red-500 text-sm mt-3 hidden text-center">Credenciales incorrectas</p>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div id="dashboard-screen" class="hidden min-h-screen p-6">
    <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-lg shadow">
      <h1 class="text-2xl font-bold text-gray-800">Panel de Control - WebApp DevOps</h1>
      <div class="flex items-center gap-4">
        <span id="health-status" class="px-3 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">Verificando Salud...</span>
        <button id="btn-logout" class="bg-red-500 text-white px-4 py-2 rounded-md text-sm">Cerrar Sesión</button>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- CRUD USUARIOS -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Gestión de Usuarios</h2>
        <form id="form-user" class="flex gap-2 mb-4">
          <input type="text" id="input-user-name" placeholder="Nombre de usuario" class="flex-1 p-2 border rounded-md" required>
          <button type="submit" id="btn-add-user" class="bg-green-600 text-white px-4 py-2 rounded-md">Agregar</button>
        </form>
        <ul id="users-list" class="divide-y divide-gray-200"></ul>
      </div>

      <!-- CRUD PRODUCTOS / ITEMS -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-gray-700">Gestión de Productos (Items)</h2>
        <form id="form-item" class="flex gap-2 mb-4">
          <input type="text" id="input-item-name" placeholder="Nombre del producto" class="flex-1 p-2 border rounded-md" required>
          <button type="submit" id="btn-add-item" class="bg-green-600 text-white px-4 py-2 rounded-md">Agregar</button>
        </form>
        <ul id="items-list" class="divide-y divide-gray-200"></ul>
      </div>
    </div>

    <!-- GRÁFICA DE DATOS -->
    <div class="bg-white p-6 rounded-lg shadow mt-6">
      <h2 class="text-xl font-bold mb-4 text-gray-700">Métricas de Registros en Sistema</h2>
      <div class="w-full max-w-lg mx-auto">
        <canvas id="metricsChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let chartInstance = null;

    // Manejo de Login
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('login-username').value;
      const pass = document.getElementById('login-password').value;

      if (user === 'admin' && pass === 'admin123') {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        document.getElementById('login-error').classList.add('hidden');
        loadData();
        checkHealth();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    });

    // Cierre de sesión limpiando credenciales
    document.getElementById('btn-logout').addEventListener('click', () => {
      document.getElementById('dashboard-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
    });

    // Health Check Status
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        const data = await res.json();
        const badge = document.getElementById('health-status');
        if (res.ok && data.status === 'OK') {
          badge.textContent = `Sistema Activo (${data.timestamp})`;
          badge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800';
        }
      } catch (err) {
        const badge = document.getElementById('health-status');
        badge.textContent = 'Error de Conexión';
        badge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800';
      }
    }

    // CRUD Operaciones
    async function loadData() {
      const resUsers = await fetch('/users');
      const dataUsers = await resUsers.json();
      const users = dataUsers.data || [];

      const resItems = await fetch('/items');
      const dataItems = await resItems.json();
      const items = dataItems.data || [];

      // Render Users
      const usersList = document.getElementById('users-list');
      usersList.innerHTML = users.map(u => `
        <li class="py-2 flex justify-between items-center">
          <span class="user-item-name">${u.name}</span>
          <button onclick="deleteUser(${u.id})" class="text-red-600 hover:text-red-800 text-sm">Eliminar</button>
        </li>
      `).join('');

      // Render Items
      const itemsList = document.getElementById('items-list');
      itemsList.innerHTML = items.map(i => `
        <li class="py-2 flex justify-between items-center">
          <span class="product-item-name">${i.item}</span>
          <button onclick="deleteItem(${i.id})" class="text-red-600 hover:text-red-800 text-sm">Eliminar</button>
        </li>
      `).join('');

      updateChart(users.length, items.length);
    }

    document.getElementById('form-user').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input-user-name');
      await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input.value })
      });
      input.value = '';
      loadData();
    });

    document.getElementById('form-item').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('input-item-name');
      await fetch('/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: input.value })
      });
      input.value = '';
      loadData();
    });

    async function deleteUser(id) {
      await fetch(`/users/${id}`, { method: 'DELETE' });
      loadData();
    }

    async function deleteItem(id) {
      await fetch(`/items/${id}`, { method: 'DELETE' });
      loadData();
    }

    function updateChart(userCount, itemCount) {
      const ctx = document.getElementById('metricsChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Usuarios', 'Productos'],
          datasets: [{
            label: 'Total de Registros',
            data: [userCount, itemCount],
            backgroundColor: ['#3B82F6', '#10B981']
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true, precision: 0 } }
        }
      });
    }
  </script>
</body>
</html>
