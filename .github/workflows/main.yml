name: CI/CD Pipeline - WebApp DevOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Pruebas, registro y publicación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pnpm/action-setup v4 lee "packageManager" de package.json (pnpm@12.4.2).
      # No declarar "version:" aquí para evitar ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests Backend (Jest)
        id: jest
        run: pnpm test

      - name: Tests E2E (Playwright)
        id: playwright
        run: pnpm test:e2e

      # Se envía por HTTP directo al runner: si hay fallo NO se abre ninguna
      # conexión SSH hacia la EC2 ( RF-02 / Criterio de aceptación 1 ).
      - name: Registrar resultado de pruebas en OpenObserve
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          JEST_OUTCOME: ${{ steps.jest.outcome }}
          PW_OUTCOME: ${{ steps.playwright.outcome }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OO_USER: ${{ secrets.OPENOBSERVE_USER }}
          OO_PASS: ${{ secrets.OPENOBSERVE_PASS }}
          OO_URL: ${{ secrets.OPENOBSERVE_URL || format('http://{0}:5080', secrets.EC2_HOST) }}
        run: |
          set -e
          OO_PASS_EFFECTIVE="$OO_PASS"
          if [ ${#OO_PASS_EFFECTIVE} -lt 8 ] || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[a-z]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[A-Z]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[0-9]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[^A-Za-z0-9]'; then
            OO_PASS_EFFECTIVE="${OO_PASS}Aa1!Aa1!"
            echo "OPENOBSERVE_PASS no cumple la política de OpenObserve; se aplicó un sufijo automático (valor no mostrado)"
          fi
          if [ "$JEST_OUTCOME" = "success" ] && [ "$PW_OUTCOME" = "success" ]; then
            EVENT=TESTS_PASSED; STATUS=SUCCESS
          else
            EVENT=TESTS_FAILED; STATUS=FAILED
          fi
          jq -n \
            --arg event "$EVENT" --arg status "$STATUS" \
            --arg jest "$JEST_OUTCOME" --arg playwright "$PW_OUTCOME" \
            --arg commit_sha "$COMMIT" --arg actor "$ACTOR" --arg branch "$BRANCH" \
            --arg run_id "$RUN_ID" --arg run_url "$RUN_URL" \
            --arg timestamp "$(date -u +%FT%TZ)" \
            --arg timestamp_mx "$(TZ=America/Mexico_City date +%FT%T)" \
            '[{event:$event, status:$status, jest:$jest, playwright:$playwright,
               commit_sha:$commit_sha, actor:$actor, branch:$branch,
               run_id:$run_id, run_url:$run_url, timestamp:$timestamp, timestamp_mx:$timestamp_mx}]' > /tmp/o2-test-event.json
          if curl -sf --connect-timeout 5 --max-time 15 -X POST \
            "$OO_URL/api/default/pipeline_logs/_json" \
            -H "Content-Type: application/json" \
            -u "$OO_USER:$OO_PASS_EFFECTIVE" \
            --data-binary @/tmp/o2-test-event.json; then
            echo "Evento $EVENT enviado a OpenObserve ($OO_URL)"
          else
            echo "Advertencia: OpenObserve no accesible desde el runner ($OO_URL). Revisar puerto 5080 / OPENOBSERVE_URL"
          fi

      - name: Login en Docker Hub
        if: success() && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        if: success() && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/webapp:latest
            ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}

  deploy:
    name: Despliegue en AWS EC2
    needs: build-and-test
    if: github.event_name == 'push' && success()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copiar script de métricas de infraestructura
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: monitor/metrics.sh
          target: /home/ubuntu

      - name: Desplegar aplicación y configurar observabilidad en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,OO_USER,OO_PASS,OO_URL,COMMIT,ACTOR
          script: |
            set -e

            echo "=== Espacio antes de limpiar ==="
            df -h / | tail -n 1
            sudo docker system df 2>/dev/null || true
            sudo docker image prune -af >/dev/null 2>&1 || true
            sudo docker builder prune -af >/dev/null 2>&1 || true
            REPO=${IMAGE_TAG%:*}
            sudo docker images --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
              | awk -v repo="$REPO" 'index($2, repo ":") == 1 && !seen[$1]++ {print $1}' \
              | tail -n +3 | xargs -r sudo docker rmi -f >/dev/null 2>&1 || true
            echo "=== Espacio después de limpiar ==="
            df -h / | tail -n 1

            OO_PASS_EFFECTIVE="$OO_PASS"
            if [ ${#OO_PASS_EFFECTIVE} -lt 8 ] || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[a-z]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[A-Z]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[0-9]' || ! printf '%s' "$OO_PASS_EFFECTIVE" | grep -q '[^A-Za-z0-9]'; then
              OO_PASS_EFFECTIVE="${OO_PASS}Aa1!Aa1!"
              echo "OPENOBSERVE_PASS no cumple la política de OpenObserve; se aplicó un sufijo automático (valor no mostrado)"
            fi

            oo_recreate() {
              echo "Recreando openobserve_data con las credenciales efectivas"
              echo "Advertencia: se pierden los datos previos de OpenObserve en este volumen"
              sudo docker rm -f openobserve >/dev/null 2>&1 || true
              sudo docker volume rm openobserve_data >/dev/null 2>&1 || true
              sudo docker run -d --name openobserve -p 5080:5080 \
                -e ZO_ROOT_USER_EMAIL="$OO_USER" \
                -e ZO_ROOT_USER_PASSWORD="$OO_PASS_EFFECTIVE" \
                -e ZO_SSRF_ALLOW_LOOPBACK=true \
                -v openobserve_data:/data --restart always \
                openobserve/openobserve:latest >/dev/null
            }
            oo_wait() {
              for i in $(seq 1 30); do
                OO_CODE=$(curl -sL -o /dev/null -w '%{http_code}' http://localhost:5080/ || true)
                [ "$OO_CODE" = "200" ] && return 0
                sleep 2
              done
              return 1
            }
            oo_probe() {
              OO_PROBE_PAYLOAD="[{\"event\":\"DEPLOY_PROBE\",\"status\":\"OK\",\"timestamp\":\"$(date -u +%FT%TZ)\"}]"
              curl -s -o /tmp/o2-probe.out -w '%{http_code}' -X POST \
                "$OO_URL/api/default/pipeline_logs/_json" \
                -H "Content-Type: application/json" \
                -u "$OO_USER:$OO_PASS_EFFECTIVE" \
                -d "$OO_PROBE_PAYLOAD" || true
            }

            if sudo docker ps -a --format '{{.Names}}' | grep -q '^openobserve$'; then
              sudo docker start openobserve > /dev/null || true
            else
              oo_recreate
              sleep 20
            fi

            echo "=== Verificando OpenObserve ==="
            if ! oo_wait; then
              echo "OpenObserve no respondió (code=$OO_CODE); recreando contenedor"
              sudo docker logs --tail 50 openobserve || true
              oo_recreate
              if ! oo_wait; then
                echo "OpenObserve sigue sin responder tras recrearlo (code=$OO_CODE)"
                sudo docker logs --tail 50 openobserve || true
                exit 1
              fi
            fi
            OO_PROBE_CODE=$(oo_probe)
            if [ "$OO_PROBE_CODE" = "401" ] || [ "$OO_PROBE_CODE" = "403" ]; then
              oo_recreate
              if ! oo_wait; then
                echo "OpenObserve no respondió tras recrearlo (code=$OO_CODE)"
                sudo docker logs --tail 50 openobserve || true
                exit 1
              fi
              OO_PROBE_CODE=$(oo_probe)
            fi
            case "$OO_PROBE_CODE" in
              200|201|204) ;;
              *)
                echo "OpenObserve rechazó el probe (code=$OO_PROBE_CODE): $(cat /tmp/o2-probe.out 2>/dev/null)"
                exit 1
                ;;
            esac

            # --- Aplicación: nueva imagen por hash de commit ---
            sudo docker pull "$IMAGE_TAG"
            sudo docker stop webapp-container 2>/dev/null || true
            sudo docker rm   webapp-container 2>/dev/null || true
            sudo docker run -d --name webapp-container \
              --add-host=host.docker.internal:host-gateway \
              -p 80:3000 -p 6061:6061 \
              -e PORT=3000 \
              -e DB_PATH=/app/data/data.sqlite \
              -e OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:5080/api/default \
              -e OTEL_EXPORTER_OTLP_USER="$OO_USER" \
              -e OTEL_EXPORTER_OTLP_PASS="$OO_PASS_EFFECTIVE" \
              -e OTEL_SERVICE_NAME=webapp-devops \
              -v webapp_data:/app/data \
              --restart always \
              "$IMAGE_TAG"

            # --- Cron de métricas de infra (idempotente, cada minuto) ---
            sudo mkdir -p /opt/monitor
            sudo install -m 700 /home/ubuntu/monitor/metrics.sh /opt/monitor/metrics.sh
            printf "OO_USER='%s'\nOO_PASS='%s'\nOO_URL='%s'\n" \
              "$OO_USER" "$OO_PASS_EFFECTIVE" "$OO_URL" | sudo tee /opt/monitor/oo.env > /dev/null
            sudo chmod 600 /opt/monitor/oo.env
            sudo crontab -l 2>/dev/null | grep -v '/opt/monitor/metrics.sh' > /tmp/oo-cron || true
            echo '* * * * * /opt/monitor/metrics.sh' >> /tmp/oo-cron
            sudo crontab /tmp/oo-cron

            # --- Verificación y evento de despliegue ---
            echo "=== Verificando container ==="
            WEBAPP_ID=$(sudo docker ps -q --filter name=webapp-container --filter status=running)
            if [ -z "$WEBAPP_ID" ]; then
              echo "webapp-container no está corriendo"
              sudo docker ps -a --filter name=webapp-container || true
              sudo docker logs --tail 100 webapp-container || true
              exit 1
            fi

            echo "=== Verificando health ==="
            HEALTH_CODE=""
            for i in $(seq 1 15); do
              HEALTH_CODE=$(curl -s -o /tmp/health.out -w '%{http_code}' http://127.0.0.1/health || true)
              if [ "$HEALTH_CODE" = "200" ] && grep -q '"status":"OK"' /tmp/health.out; then
                break
              fi
              sleep 2
            done
            if [ "$HEALTH_CODE" != "200" ] || ! grep -q '"status":"OK"' /tmp/health.out; then
              echo "Health check falló (code=$HEALTH_CODE): $(cat /tmp/health.out 2>/dev/null)"
              sudo ss -ltnp 2>/dev/null | grep -E ':80|:3000' || true
              sudo docker logs --tail 100 webapp-container || true
              exit 1
            fi
            cat /tmp/health.out

            echo "=== Registrando despliegue ==="
            OO_DEPLOY_PAYLOAD="[{\"event\":\"DEPLOYMENT_SUCCESSFUL\",\"status\":\"DEPLOYED\",\"image\":\"$IMAGE_TAG\",\"commit_sha\":\"$COMMIT\",\"actor\":\"$ACTOR\",\"timestamp\":\"$(date -u +%FT%TZ)\",\"timestamp_mx\":\"$(TZ=America/Mexico_City date +%FT%T)\"}]"
            OO_DEPLOY_CODE=$(curl -s -o /tmp/o2-deploy.out -w '%{http_code}' -X POST \
              "$OO_URL/api/default/pipeline_logs/_json" \
              -H "Content-Type: application/json" \
              -u "$OO_USER:$OO_PASS_EFFECTIVE" \
              -d "$OO_DEPLOY_PAYLOAD" || true)
            if [ "$OO_DEPLOY_CODE" != "200" ] && [ "$OO_DEPLOY_CODE" != "201" ] && [ "$OO_DEPLOY_CODE" != "204" ]; then
              echo "Reintentando evento de despliegue (code=$OO_DEPLOY_CODE)"
              sleep 10
              OO_DEPLOY_CODE=$(curl -s -o /tmp/o2-deploy.out -w '%{http_code}' -X POST \
                "$OO_URL/api/default/pipeline_logs/_json" \
                -H "Content-Type: application/json" \
                -u "$OO_USER:$OO_PASS_EFFECTIVE" \
                -d "$OO_DEPLOY_PAYLOAD" || true)
            fi
            case "$OO_DEPLOY_CODE" in
              200|201|204) ;;
              *)
                echo "No se pudo registrar DEPLOYMENT_SUCCESSFUL (code=$OO_DEPLOY_CODE): $(cat /tmp/o2-deploy.out 2>/dev/null)"
                exit 1
                ;;
            esac
            echo "Despliegue verificado y registrado en OpenObserve"
            sudo docker image prune -af >/dev/null 2>&1 || true
        env:
          IMAGE_TAG: ${{ secrets.DOCKER_USERNAME }}/webapp:${{ github.sha }}
          OO_USER: ${{ secrets.OPENOBSERVE_USER }}
          OO_PASS: ${{ secrets.OPENOBSERVE_PASS }}
          OO_URL: http://localhost:5080
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
